services:
    monerod:
        image: ghcr.io/farcaster-project/containers/monerod:0.18.5.1
        environment:
            NETWORK: regtest
            OFFLINE: --offline
            DIFFICULTY: 1
        ports:
            - 18081:18081
            - 18082:18082
    monero-wallet-rpc:
        image: ghcr.io/farcaster-project/containers/monero-wallet-rpc:0.18.5.1
        environment:
            MONERO_DAEMON_ADDRESS: monerod:18081
            WALLET_RPC_PORT: 18083
        depends_on:
            - "monerod"
        ports:
            - 18083:18083
    monero-wallet-lws:
        image: ghcr.io/farcaster-project/containers/monero-lws:0.3-monero-0.18.5.1
        environment:
            NETWORK: main
            MONERO_DAEMON_ADDRESS: monerod:18082
        depends_on:
            - "monerod"
        ports:
            - 38884:38884
