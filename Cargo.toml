[package]
name = "monero-lws"
version = "0.3.0"
authors = ["Monero Rust Contributors", "Sebastian Kung <seb.kung@gmail.com>"]
edition = "2024"
include = [
  "src/*",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
]
keywords = ["monero", "asynchronous", "net"]
license = "MIT"
documentation = "https://docs.rs/monero-lws"
repository = "https://github.com/monero-rs/monero-lws"
description = "RPC client for Monero light wallet server"
rust-version = "1.89.0"

[dependencies]
anyhow = "1"
fixed-hash = "0.8"
hex = "0.4"
http = "1.4"
jsonrpc-core = "18"
monero = { git = "https://github.com/silverpill/monero-oxide-compat", rev = "5d9b30025497db3c869f546c9129285bf6909520", package = "monero-oxide-compat" }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
# Async
rand = "0.8.4"
tokio = { version = "1.12.0", features = ["full"] }
monero-rpc = { git = "https://github.com/silverpill/monero-rpc-rs", rev = "ef8f975a9a096e193090ffc6df4c0f36db272b61" }

[lints.rust]
# The warning comes from fixed-hash
# https://github.com/paritytech/parity-common/commit/9ff9316a53d03e14c267aa6dcc45c478bfb2b12a
unexpected_cfgs = "allow"


[lints.clippy]
unwrap_used = "warn"
